<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="纯前端 A股/港股均线测算工具：基于最近 260 个交易日收盘价计算 MA5/10/20/60/120/250，并按标的实际涨跌停区间推演预测收盘价与均线值。">
<meta name="theme-color" content="#2563eb">
<title>A股均线测算工具</title>
<!-- 内联空图标，避免浏览器请求默认 favicon 产生 404 -->
<link rel="icon" href="data:,">
<!-- 提前建立到行情接口的 DNS/TLS 连接，降低首次查询延迟 -->
<link rel="preconnect" href="https://web.ifzq.gtimg.cn" crossorigin>
<link rel="dns-prefetch" href="https://web.ifzq.gtimg.cn">
<!-- 样式表引入 -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<header class="header">
  <h1>A股均线测算工具</h1>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色主题" title="切换到深色主题">
    <span id="themeIcon" aria-hidden="true">&#9790;</span>
  </button>
</header>

<!-- ===== 主容器 ===== -->
<main class="container">
  <!-- 输入区域 -->
  <section class="input-section" aria-label="股票查询">
    <div class="input-row">
      <div class="input-group input-group-grow">
        <label for="stockInput">股票代码</label>
        <div class="input-wrapper">
          <input type="text" id="stockInput" placeholder="例：600519 / 510300 / 00700" maxlength="6" inputmode="numeric"
                 autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false"
                 aria-controls="autocompleteList" aria-autocomplete="list">
          <div class="autocomplete-list" id="autocompleteList" role="listbox" aria-label="历史查询记录"></div>
        </div>
      </div>
      <div class="input-actions">
        <button class="btn btn-primary" id="queryBtn" type="button">查询</button>
        <button class="btn btn-secondary" id="clearBtn" type="button">清空</button>
      </div>
    </div>
  </section>

  <!-- 状态栏（查询后显示） -->
  <div class="status-bar hidden" id="statusBar" role="status" aria-live="polite"></div>

  <!-- 信号摘要卡（查询后显示） -->
  <div class="signal-card hidden" id="signalCard" role="status" aria-live="polite"></div>

  <!-- 结果区域 -->
  <section class="result-section" id="resultSection" aria-label="测算结果">
    <div class="result-header">
      <h2 id="resultTitle">均线测算结果</h2>
      <div class="export-actions" role="group" aria-label="导出测算结果">
        <button class="copy-btn" id="copyBtn" type="button">复制文本</button>
        <button class="copy-btn" id="copyCsvBtn" type="button">复制CSV</button>
        <button class="copy-btn" id="copyMdBtn" type="button">复制Markdown</button>
        <button class="copy-btn" id="exportPngBtn" type="button">导出图片</button>
      </div>
    </div>
    <!-- 推演档位步长切换 -->
    <div class="sr-toggle-bar-inline hidden" id="tableToolbar" role="group" aria-label="推演档位步长">
      <span class="sr-toggle-title">档位步长:</span>
      <div class="sr-toggle-item">
        <input type="radio" name="changeStep" id="step1" value="1" checked>
        <label for="step1">每 1%</label>
      </div>
      <div class="sr-toggle-item">
        <input type="radio" name="changeStep" id="step5" value="5">
        <label for="step5">每 5%</label>
      </div>
    </div>
    <!-- 涨跌推演表容器 -->
    <div class="tables-wrapper" id="tablesWrapper"></div>
    <!-- 标注层切换条：首次渲染图表时会被移入图表卡片，显示在 K 线图标题下方 -->
    <div class="sr-toggle-bar-inline hidden" id="srToggleBar" role="group" aria-label="图表标注层开关">
      <span class="sr-toggle-title">标注层:</span>
      <div class="sr-toggle-item">
        <input type="checkbox" id="toggleSupRes" checked>
        <label for="toggleSupRes"><span class="sr-dot sr-dot-resistance" aria-hidden="true"></span>支撑/压力</label>
      </div>
      <div class="sr-toggle-item">
        <input type="checkbox" id="toggleFib" checked>
        <label for="toggleFib"><span class="sr-dot sr-dot-fib" aria-hidden="true"></span>斐波那契回撤</label>
      </div>
      <div class="sr-toggle-item">
        <input type="checkbox" id="toggleLongMA">
        <label for="toggleLongMA"><span class="sr-dot sr-dot-longma" aria-hidden="true"></span>长周期均线</label>
      </div>
    </div>
    <!-- K线图容器 -->
    <div id="chartArea"></div>
  </section>

  <!-- 空状态提示 -->
  <div class="empty-state" id="emptyState">
    <div class="icon" aria-hidden="true">&#128202;</div>
    <p>请输入股票代码，点击查询获取均线测算结果</p>
  </div>

  <noscript><p class="noscript-tip">本工具依赖 JavaScript 运行，请在浏览器中启用 JavaScript 后重试。</p></noscript>
</main>

<!-- ===== 加载遮罩 ===== -->
<div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
  <div class="loading-box">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loadingText">正在获取数据...</p>
  </div>
</div>

<!-- ===== 错误提示Toast ===== -->
<div class="error-toast" id="errorToast" role="alert" aria-atomic="true"></div>

<!-- ===== 纯逻辑层（与 UI 解耦，可独立单测） ===== -->
<script src="js/core.js"></script>
<!-- ===== UI 层：模块分区（状态 / 数据访问 / 图表 / 表格 / 流程 / 事件） ===== -->
<script>

(function() {
  'use strict';

  var C = window.MACore;
  var CONFIG = C.CONFIG;
  var D = C.formatPrice;           // 价格格式化（统一 '-' 兜底）

  /* =========================================================
   * 1. 应用状态：唯一数据源，避免散落的隐式全局变量
   * ========================================================= */
  var state = {
    history: [],                    // 本地查询历史
    code: '', name: '',             // 当前股票
    market: null,                   // sh / sz / hk
    marketStatus: 'closed',         // intraday / closed
    sourceName: '',                 // 数据源名称
    prices: [],                     // 参与计算的历史收盘价（最近 N 个交易日）
    klines: [],                     // 与 prices 严格等长的 OHLC 数据
    lastPrice: 0,                   // 最新价
    prevClose: 0,                   // 昨收（用于反推涨跌停幅度）
    limitUp: null,                  // 涨停价（仅 A 股有效）
    limitDown: null,                // 跌停价
    quoteTime: '',                  // 行情时间原始值（市场状态判定依据）
    basePrice: 0,                   // 推演基准价（盘中为昨收，收盘为今收）
    digits: 2,                      // 价格显示精度
    levels: [],                     // 支撑/压力/斐波那契关键位
    ma: {},                         // 各周期逐日均线序列
    baseMAs: {},                    // 各周期最新均线值
    maPeriods: [],                  // 当前使用的均线周期（含长周期）
    signal: null,                   // 信号摘要
    range: null,                    // 推演区间 { up, down, source }
    fallbackLimit: 10,              // 无涨跌停价时采用的兜底区间（A股 10%，港股 30%）
    rows: [],                       // 推演数据（表格与复制文本共用）
    selectedPct: null,              // 当前选中的涨跌幅
    changeStep: 1,                  // 推演档位步长（1% 或 5%）
    showSupport: true,              // 标注层：支撑/压力
    showFibonacci: true,            // 标注层：斐波那契
    showLongMA: false               // 标注层：长周期均线（MA120/MA250）
  };

  var lastResultText = '';
  var querySeq = 0;                 // 查询序号：丢弃过期响应
  var inflight = null;              // 进行中的请求（同代码去重）
  var resultCache = {};             // 结果缓存（短期复用，减少重复请求）
  var currentAbort = null;          // 当前请求控制器（新查询会取消旧请求）
  var errorTimer = null;
  var copyTimer = null;

  /* =========================================================
   * 2. DOM 引用与小工具
   * ========================================================= */
  var stockInput = document.getElementById('stockInput');
  var queryBtn = document.getElementById('queryBtn');
  var clearBtn = document.getElementById('clearBtn');
  var themeToggle = document.getElementById('themeToggle');
  var themeIcon = document.getElementById('themeIcon');
  var statusBar = document.getElementById('statusBar');
  var signalCard = document.getElementById('signalCard');
  var resultSection = document.getElementById('resultSection');
  var tablesWrapper = document.getElementById('tablesWrapper');
  var chartArea = document.getElementById('chartArea');
  var resultTitle = document.getElementById('resultTitle');
  var copyBtn = document.getElementById('copyBtn');
  var copyCsvBtn = document.getElementById('copyCsvBtn');
  var copyMdBtn = document.getElementById('copyMdBtn');
  var exportPngBtn = document.getElementById('exportPngBtn');
  var emptyState = document.getElementById('emptyState');
  var loadingOverlay = document.getElementById('loadingOverlay');
  var errorToast = document.getElementById('errorToast');
  var autocompleteList = document.getElementById('autocompleteList');
  var srToggleBar = document.getElementById('srToggleBar');
  var toggleSupResEl = document.getElementById('toggleSupRes');
  var toggleFibEl = document.getElementById('toggleFib');
  var toggleLongMAEl = document.getElementById('toggleLongMA');
  var tableToolbar = document.getElementById('tableToolbar');
  var step1El = document.getElementById('step1');
  var step5El = document.getElementById('step5');

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 隐私模式下忽略 */ }
  }
  function showLoading(show) {
    loadingOverlay.classList.toggle('show', !!show);
  }
  function showError(msg) {
    errorToast.innerHTML = '<span class="toast-msg">' + C.escapeHtml(msg) + '</span>'
      + '<button type="button" class="toast-retry" id="toastRetry">重试</button>';
    errorToast.classList.add('show');
    var retry = errorToast.querySelector('#toastRetry');
    if (retry) retry.addEventListener('click', function () { hideError(); doQuery(); });
    if (errorTimer) clearTimeout(errorTimer);          // 避免旧定时器提前关闭新提示
    errorTimer = setTimeout(hideError, 8000);
  }
  function hideError() {
    errorToast.classList.remove('show');
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
  }

  /* =========================================================
   * 3. 主题
   * ========================================================= */
  function applyTheme(isDark, persist) {
    if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    themeIcon.innerHTML = isDark ? '&#9788;' : '&#9790;';
    var label = isDark ? '切换到浅色主题' : '切换到深色主题';
    themeToggle.setAttribute('aria-label', label);
    themeToggle.setAttribute('title', label);
    if (persist) storageSet(CONFIG.THEME_KEY, isDark ? 'dark' : 'light');
    scheduleChartPaint();                              // 主题切换后同步图表配色
  }
  themeToggle.addEventListener('click', function () {
    applyTheme(!document.documentElement.hasAttribute('data-theme'), true);
  });
  applyTheme(storageGet(CONFIG.THEME_KEY) === 'dark', false);

  /* =========================================================
   * 4. 查询历史与自动补全
   * ========================================================= */
  var acIndex = -1;

  function loadHistory() {
    var parsed;
    try { parsed = JSON.parse(storageGet(CONFIG.HISTORY_KEY) || '[]'); } catch (e) { parsed = []; }
    state.history = Array.isArray(parsed) ? parsed : [];
  }
  function saveHistory(code, name) {
    state.history = state.history.filter(function (h) { return h.code !== code; });
    state.history.unshift({ code: code, name: name, time: Date.now() });
    if (state.history.length > CONFIG.HISTORY_MAX) state.history = state.history.slice(0, CONFIG.HISTORY_MAX);
    storageSet(CONFIG.HISTORY_KEY, JSON.stringify(state.history));
  }
  loadHistory();

  function hideAutocomplete() {
    autocompleteList.classList.remove('show');
    stockInput.setAttribute('aria-expanded', 'false');
    stockInput.removeAttribute('aria-activedescendant');
    acIndex = -1;
  }

  function showAutocomplete(val) {
    if (!val) { hideAutocomplete(); return; }
    var matches = state.history.filter(function (h) {
      return h.code.indexOf(val) !== -1 || val.indexOf(h.code) !== -1;
    });
    if (matches.length === 0) { hideAutocomplete(); return; }

    acIndex = -1;
    // 历史记录中的名称来自外部接口，统一转义后再注入
    autocompleteList.innerHTML = matches.map(function (h, i) {
      return '<div class="autocomplete-item" role="option" id="ac-item-' + i + '" aria-selected="false"'
        + ' data-code="' + C.escapeHtml(h.code) + '">'
        + '<span>' + C.escapeHtml(h.code) + '</span>'
        + '<span class="stock-name">' + C.escapeHtml(h.name || '') + '</span></div>';
    }).join('');
    autocompleteList.classList.add('show');
    stockInput.setAttribute('aria-expanded', 'true');

    var items = autocompleteList.querySelectorAll('.autocomplete-item');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('mousedown', function (e) { e.preventDefault(); });  // 避免输入框失焦
      items[i].addEventListener('click', function () { pickAutocomplete(this); });
    }
  }

  function setActiveItem(index) {
    var items = autocompleteList.querySelectorAll('.autocomplete-item');
    if (!items.length) return;
    if (index < 0) index = items.length - 1;
    if (index >= items.length) index = 0;
    for (var i = 0; i < items.length; i++) {
      var active = i === index;
      items[i].classList.toggle('active', active);
      items[i].setAttribute('aria-selected', String(active));
    }
    acIndex = index;
    stockInput.setAttribute('aria-activedescendant', items[index].id);
    items[index].scrollIntoView({ block: 'nearest' });
  }

  function pickAutocomplete(el) {
    stockInput.value = el.dataset.code;
    hideAutocomplete();
    stockInput.focus();
  }

  // 先过滤非数字，再触发补全，避免用含非法字符的脏值匹配历史记录
  stockInput.addEventListener('input', function () {
    stockInput.value = stockInput.value.replace(/[^\d]/g, '');
    showAutocomplete(stockInput.value.trim());
  });
  stockInput.addEventListener('focus', function () {
    if (stockInput.value.trim()) showAutocomplete(stockInput.value.trim());
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.input-wrapper')) hideAutocomplete();
  });

  stockInput.addEventListener('keydown', function (e) {
    var listOpen = autocompleteList.classList.contains('show');
    if (e.key === 'ArrowDown' && listOpen) { e.preventDefault(); setActiveItem(acIndex + 1); return; }
    if (e.key === 'ArrowUp' && listOpen) { e.preventDefault(); setActiveItem(acIndex - 1); return; }
    if (e.key === 'Escape') { hideAutocomplete(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      // 用方向键显式选中候选项时才填入，否则直接查询（保持原有回车即查询的习惯）
      if (listOpen && acIndex >= 0) {
        setActiveItem(acIndex);
        pickAutocomplete(autocompleteList.querySelectorAll('.autocomplete-item')[acIndex]);
      } else {
        doQuery();
      }
    }
  });

  /* =========================================================
   * 5. 数据访问：超时 / 取消 / 去重 / 缓存
   * ========================================================= */
  function fetchTencentData(code, market, signal) {
    var ticker = market + code;
    var url = CONFIG.API_URL + '?param=' + ticker + ',day,,,' + CONFIG.KLINE_DAYS + ',qfq';
    return fetch(url, { signal: signal })
      .then(function (r) {
        if (!r.ok) throw new Error('腾讯接口 ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var kd = data && data.data && data.data[ticker];
        if (!kd) throw new Error('腾讯接口无此股票数据');

        // qt 为对象：qt[ticker][1] 为名称，[3] 为最新价，[4] 为昨收，[30] 为行情时间
        var qt = kd.qt;
        if (!qt) throw new Error('腾讯接口 quote 数据不完整');
        var inner = qt[ticker];
        if (!inner || !Array.isArray(inner)) throw new Error('腾讯接口 quote 数据格式错误');
        var name = inner[1] || ('股票' + code);
        var price = parseFloat(inner[3]) || 0;
        if (!price) throw new Error('腾讯接口解析不到价格');
        var prevClose = parseFloat(inner[4]) || 0;
        // 实测：仅 A 股的 [47]/[48] 是涨跌停价；港股这两位是无关数值，必须排除
        var limitUp = market === 'hk' ? null : (parseFloat(inner[47]) || null);
        var limitDown = market === 'hk' ? null : (parseFloat(inner[48]) || null);
        var quoteTime = inner[30] || '';

        var days = kd.qfqday || kd.day || [];
        if (!Array.isArray(days) || days.length === 0) throw new Error('腾讯 kline 无日线数据');

        // 行格式：[日期, 开盘, 收盘, 最高, 最低, 成交量]
        // 关键：价格无效时同时跳过价格与 K 线，保证两个数组严格等长、下标对齐
        var prices = [];
        var klines = [];
        for (var i = 0; i < days.length; i++) {
          var row = days[i];
          if (!row || !Array.isArray(row) || row.length < 3) continue;
          if (typeof row[2] === 'object') continue;
          var close = parseFloat(row[2]);
          if (isNaN(close)) continue;
          prices.push(close);
          klines.push({
            date: row[0],
            open: parseFloat(row[1]) || close,
            close: close,
            high: parseFloat(row[3]) || close,
            low: parseFloat(row[4]) || close
          });
        }
        if (prices.length === 0) throw new Error('腾讯 kline 解析不到收盘价');

        return {
          name: name, price: price, prevClose: prevClose,
          limitUp: limitUp, limitDown: limitDown, quoteTime: quoteTime,
          prices: prices, klines: klines, source: '腾讯'
        };
      });
  }

  // 单次网络请求：8 秒超时（AbortController），新查询会取消旧查询
  function requestData(code, market) {
    if (currentAbort) {
      currentAbort.cancelled = true;
      currentAbort.controller.abort();
    }
    var rec = { controller: new AbortController(), timedOut: false, cancelled: false };
    currentAbort = rec;

    var timer = setTimeout(function () {
      rec.timedOut = true;
      rec.controller.abort();                          // 真正中止网络请求，避免悬挂
    }, CONFIG.REQUEST_TIMEOUT_MS);

    return fetchTencentData(code, market, rec.controller.signal)
      .then(function (result) {
        clearTimeout(timer);
        return result;
      })
      .catch(function (err) {
        clearTimeout(timer);
        if (rec.timedOut) throw new Error('数据请求超时，请检查网络连接后重试');
        if (rec.cancelled || (err && err.name === 'AbortError')) {
          var cancelled = new Error('查询已取消');
          cancelled.cancelled = true;
          throw cancelled;
        }
        throw new Error('数据获取失败: ' + ((err && err.message) || '未知错误'));
      });
  }

  // 统一出口：相同代码进行中请求去重 + 短期结果缓存，避免重复请求
  function fetchAllData(code, market) {
    var key = market + code;

    if (inflight && inflight.key === key) return inflight.promise;

    var cached = resultCache[key];
    if (cached && Date.now() - cached.time < CONFIG.CACHE_TTL_MS) {
      return Promise.resolve(cached.data);
    }

    var promise = requestData(code, market).then(function (data) {
      resultCache[key] = { time: Date.now(), data: data };
      return data;
    });
    inflight = { key: key, promise: promise };
    var release = function () { if (inflight && inflight.promise === promise) inflight = null; };
    promise.then(release, release);
    return promise;
  }

  /* =========================================================
   * 6. 图表模块（复用 DOM，通过显式入参绘制，不读取隐式全局）
   * ========================================================= */
  var chart = { opts: null, refs: null, rafId: null, metrics: null, hoverIndex: null };
  var resizeTimer = null;

  function createChartShell(container) {
    container.innerHTML = '';

    var card = document.createElement('div');
    card.className = 'chart-card';

    var title = document.createElement('div');
    title.className = 'table-card-title';
    title.setAttribute('role', 'button');
    title.setAttribute('tabindex', '0');
    title.setAttribute('aria-expanded', 'true');

    var titleText = document.createElement('span');
    titleText.className = 'chart-title-text';

    var icon = document.createElement('span');
    icon.className = 'toggle-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = '&#9650;';

    title.appendChild(titleText);
    title.appendChild(icon);

    var wrap = document.createElement('div');
    wrap.className = 'chart-canvas-wrap show';
    var canvas = document.createElement('canvas');
    canvas.id = 'klineCanvas';
    canvas.setAttribute('role', 'img');
    wrap.appendChild(canvas);

    card.appendChild(title);
    // 标注层开关跟随图表标题显示（首次创建卡片时把它从结果区移入卡片，位于标题与画布之间）
    if (srToggleBar) card.appendChild(srToggleBar);
    card.appendChild(wrap);
    container.appendChild(card);

    var refs = { card: card, title: title, titleText: titleText, icon: icon, wrap: wrap, canvas: canvas };

    // 十字光标：鼠标移动 / 触摸拖动时显示该根 K 线的开高低收与均线值
    canvas.addEventListener('mousemove', onCanvasPointerMove);
    canvas.addEventListener('mouseleave', function () { setHoverIndex(null); });
    canvas.addEventListener('touchstart', onCanvasPointerMove, { passive: true });
    canvas.addEventListener('touchmove', onCanvasPointerMove, { passive: true });
    canvas.addEventListener('touchend', function () { setHoverIndex(null); });

    function toggleCollapse() {
      var show = !wrap.classList.contains('show');
      wrap.classList.toggle('show', show);
      title.setAttribute('aria-expanded', String(show));
      icon.innerHTML = show ? '&#9650;' : '&#9660;';
      if (show) scheduleChartPaint();
    }
    title.addEventListener('click', toggleCollapse);
    title.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCollapse(); }
    });

    return refs;
  }

  function updateChartTitle() {
    var o = chart.opts;
    if (!o || !chart.refs) return;
    var sub = o.projectedPrice
      ? ' (预测收盘: ' + D(o.projectedPrice, o.digits) + ')'
      : '';
    chart.refs.titleText.innerHTML = C.escapeHtml(o.name) + '(' + C.escapeHtml(o.code) + ') K线图'
      + '<span class="chart-title-sub">' + sub + '</span>';
  }

  // 绘制入口：首次创建卡片，后续复用（保留折叠状态，避免闪烁）
  function drawKLineChart(opts) {
    chart.opts = opts;
    chart.hoverIndex = null;                               // 换股票后清除上一次的光标位置
    if (!chart.refs) chart.refs = createChartShell(chartArea);
    updateChartTitle();
    scheduleChartPaint();
  }

  /* ===== 十字光标交互 ===== */
  function setHoverIndex(idx) {
    if (chart.hoverIndex === idx) return;
    chart.hoverIndex = idx;
    scheduleChartPaint();
  }

  // 把鼠标/触摸位置换算成 K 线下标（用 metrics 中的几何信息，避免重复计算缩放）
  function onCanvasPointerMove(e) {
    var m = chart.metrics;
    if (!m || !chart.refs) return;
    var ev = e || {};
    var clientX = (ev.touches && ev.touches.length) ? ev.touches[0].clientX : ev.clientX;
    if (clientX == null) return;
    var rect = chart.refs.canvas.getBoundingClientRect();
    if (!rect || !rect.width) return;
    var x = (clientX - rect.left) * (m.cssW / rect.width);  // 换算到画布 CSS 像素坐标
    var idx = Math.floor((x - m.padL) / m.chartW * m.totalPts);
    if (idx < 0) idx = 0;
    if (idx > m.len - 1) idx = m.len - 1;
    setHoverIndex(m.len ? idx : null);
  }

  // 十字线与悬浮信息框（仅真实 K 线区间内有效）
  function drawCrosshair(ctx, isDark, pal) {
    var m = chart.metrics;
    var v = chart.view;
    if (!m || !v) return;
    var i = chart.hoverIndex;
    if (i == null || i < 0 || i >= m.len) return;
    var k = v.klines[i];
    if (!k) return;

    var x = m.xOf(i);
    var y = m.yOf(k.close);

    ctx.save();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = isDark ? '#64748b' : '#94a3b8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, m.padT);
    ctx.lineTo(x, m.padT + m.chartH);
    ctx.moveTo(m.padL, y);
    ctx.lineTo(m.padL + m.chartW, y);
    ctx.stroke();
    ctx.restore();

    var lines = [
      (k.date || '-') + '  开 ' + D(k.open, m.digits) + '  高 ' + D(k.high, m.digits)
        + '  低 ' + D(k.low, m.digits) + '  收 ' + D(k.close, m.digits)
    ];
    // 只列出当前图表窗口内确实有值的均线，避免给出与实际绘制无关的数值
    var maPairs = [['MA5', v.ma5], ['MA10', v.ma10], ['MA20', v.ma20], ['MA60', v.ma60]];
    if (state.showLongMA) maPairs.push(['MA120', v.ma120], ['MA250', v.ma250]);
    var maTexts = [];
    for (var p = 0; p < maPairs.length; p++) {
      var arr = maPairs[p][1];
      if (!arr || arr[i] == null) continue;
      maTexts.push(maPairs[p][0] + ' ' + D(arr[i], m.digits));
    }
    if (maTexts.length) lines.push(maTexts.join('  '));

    ctx.font = '11px sans-serif';
    var boxW = 0;
    for (var t = 0; t < lines.length; t++) boxW = Math.max(boxW, ctx.measureText(lines[t]).width);
    boxW += 16;
    var lineH = 15;
    var boxH = lines.length * lineH + 10;
    var boxX = m.padL + 6;
    var boxY = m.padT + 4;
    // 光标落在信息框区域内时，把信息框移到底部，避免遮挡正在查看的 K 线
    if (y < boxY + boxH + 10 && x < boxX + boxW + 20) boxY = m.padT + m.chartH - boxH - 4;

    ctx.fillStyle = isDark ? 'rgba(15,23,42,0.92)' : 'rgba(255,255,255,0.95)';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = isDark ? '#475569' : '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);

    ctx.textAlign = 'left';
    var ty = boxY + 16;
    for (var n = 0; n < lines.length; n++) {
      ctx.fillStyle = n === 0 ? (isDark ? '#e2e8f0' : '#1a1a2e') : pal.text;
      ctx.font = (n === 0 ? 'bold ' : '') + '11px sans-serif';
      ctx.fillText(lines[n], boxX + 8, ty);
      ty += lineH;
    }

    // 纵轴价格气泡：让用户直接知道光标所在价位
    var priceText = D(k.close, m.digits);
    ctx.font = 'bold 10px sans-serif';
    var pw = ctx.measureText(priceText).width + 10;
    ctx.fillStyle = isDark ? '#475569' : '#e2e8f0';
    ctx.fillRect(m.padL - pw - 1, y - 7, pw, 14);
    ctx.fillStyle = isDark ? '#f1f5f9' : '#1a1a2e';
    ctx.textAlign = 'right';
    ctx.fillText(priceText, m.padL - 5, y + 3);
  }

  function setProjectedPrice(price) {
    if (!chart.opts) return;
    chart.opts.projectedPrice = price;
    updateChartTitle();
    scheduleChartPaint();
  }

  // 合并同一帧内的多次绘制请求
  function scheduleChartPaint() {
    // chart 由 var 提升，顶层 applyTheme() 早于其初始化执行，需防止读取 undefined
    if (!chart || !chart.opts) return;
    if (chart.rafId) cancelAnimationFrame(chart.rafId);
    chart.rafId = requestAnimationFrame(function () {
      chart.rafId = null;
      paintChart();
    });
  }

  function paintChart() {
    var o = chart.opts;
    var refs = chart.refs;
    if (!o || !refs) return;
    if (!refs.wrap.classList.contains('show')) return;    // 折叠时不绘制，展开时再画

    var canvas = refs.canvas;
    var W = Math.round(canvas.parentElement.getBoundingClientRect().width - 24);  // 减去容器内边距
    if (W <= 0) return;                                   // 容器不可见时跳过，避免 0 宽画布
    var dpr = window.devicePixelRatio || 1;
    var H = parseInt(getComputedStyle(canvas).height, 10) || 360;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var isDark = document.documentElement.hasAttribute('data-theme');
    var pal = CONFIG.COLORS[isDark ? 'dark' : 'light'];
    var winColor = pal.win;
    var lossColor = pal.loss;
    var digits = o.digits;

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);

    // padR 为右侧均线数值标签预留空间：否则最后一根 K 线紧贴右边，标签会被裁掉
    var padL = 55, padR = 86, padT = 15, padB = 30;
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;

    // 只绘制最近若干根 K 线：根数过多时每根被压到 1-2px，反而看不出形态。
    // 均线与推演仍使用完整历史（o.klines 全量），此处仅裁剪「显示窗口」。
    var maxBars = state.showLongMA ? CONFIG.CHART_BARS_LONG : CONFIG.CHART_BARS;
    var byWidth = Math.floor(chartW / CONFIG.BAR_MIN_PX);          // 按画布宽度自适应，避免窄屏过密
    var bars = Math.min(maxBars, Math.max(CONFIG.CHART_MIN_BARS, byWidth));
    var offset = Math.max(0, o.klines.length - bars);
    function tail(arr) { return arr ? arr.slice(offset) : null; }
    var view = {
      klines: o.klines.slice(offset),
      ma5: tail(o.ma5Arr), ma10: tail(o.ma10Arr), ma20: tail(o.ma20Arr),
      ma60: tail(o.ma60Arr), ma120: tail(o.ma120Arr), ma250: tail(o.ma250Arr)
    };
    chart.view = view;

    var hasProjection = o.projectedPrice != null && o.projectedPrice > 0;
    var totalPts = view.klines.length + (hasProjection ? 1 : 0);
    if (totalPts <= 0) return;

    canvas.setAttribute('aria-label',
      o.name + '(' + o.code + ') K线图，显示最近 ' + view.klines.length + ' 个交易日，含 MA5/MA10/MA20/MA60 均线'
      + (o.projectedPrice ? '，末位为预测收盘 ' + D(o.projectedPrice, o.digits) : ''));

    // 预测均线只计算一次，供坐标范围、连线与标签复用
    var future = null;
    if (hasProjection) {
      future = {
        ma5: C.calcProjectedMA(o.prices, o.projectedPrice, 5),
        ma10: C.calcProjectedMA(o.prices, o.projectedPrice, 10),
        ma20: C.calcProjectedMA(o.prices, o.projectedPrice, 20),
        ma60: C.calcProjectedMA(o.prices, o.projectedPrice, 60),
        ma120: C.calcProjectedMA(o.prices, o.projectedPrice, 120),
        ma250: C.calcProjectedMA(o.prices, o.projectedPrice, 250)
      };
    }

    // 收集所有参与缩放的价格（MA60 始终参与，因其默认绘制）
    var allVals = [];
    var i;
    for (i = 0; i < view.klines.length; i++) {
      var k = view.klines[i];
      if (k.high) allVals.push(k.high);
      if (k.low) allVals.push(k.low);
      if (k.close) allVals.push(k.close);
    }
    var maSeries = [view.ma5, view.ma10, view.ma20, view.ma60];
    if (state.showLongMA) maSeries = maSeries.concat([view.ma120, view.ma250]);
    maSeries.forEach(function (arr) {
      if (!arr) return;
      for (var m = 0; m < arr.length; m++) { if (arr[m] != null) allVals.push(arr[m]); }
    });
    if (hasProjection) {
      allVals.push(o.projectedPrice);
      if (future.ma5 != null) allVals.push(future.ma5);
      if (future.ma10 != null) allVals.push(future.ma10);
      if (future.ma20 != null) allVals.push(future.ma20);
      if (future.ma60 != null) allVals.push(future.ma60);
    }
    if (allVals.length === 0) return;

    var minV = Math.min.apply(null, allVals);
    var maxV = Math.max.apply(null, allVals);
    var range = maxV - minV || 1;
    var margin = range * 0.08;
    minV -= margin;
    maxV += margin;
    range = maxV - minV;

    function xPos(index) { return padL + (index + 0.5) / totalPts * chartW; }
    function yPos(value) { return padT + (1 - (value - minV) / range) * chartH; }

    // 网格与纵轴刻度
    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 0.5;
    var gridLines = 5;
    for (var g = 0; g <= gridLines; g++) {
      var gy = padT + g / gridLines * chartH;
      ctx.beginPath();
      ctx.moveTo(padL, gy);
      ctx.lineTo(W - padR, gy);
      ctx.stroke();
      ctx.fillStyle = pal.text;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(D(maxV - g / gridLines * range, digits), padL - 5, gy + 3);
    }

    // 图例（依次推进 x 坐标，避免文字互相重叠）
    var legend = [];
    if (view.ma5) legend.push({ text: 'MA5', color: pal.ma5 });
    if (view.ma10) legend.push({ text: 'MA10', color: pal.ma10 });
    if (view.ma20) legend.push({ text: 'MA20', color: pal.ma20 });
    if (view.ma60) legend.push({ text: 'MA60', color: pal.ma60 });
    if (state.showLongMA) {
      if (view.ma120) legend.push({ text: 'MA120', color: pal.ma120 });
      if (view.ma250) legend.push({ text: 'MA250', color: pal.ma250 });
    }
    if (hasProjection) legend.push({ text: '预测', color: pal.future });
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    var lx = padL + 5;
    for (i = 0; i < legend.length; i++) {
      ctx.fillStyle = legend[i].color;
      ctx.fillText(legend[i].text, lx, padT + 12);
      lx += ctx.measureText(legend[i].text).width + 12;
    }

    // 支撑/压力/斐波那契标注层
    if (o.levels && o.levels.length) {
      for (var sl = 0; sl < o.levels.length; sl++) {
        var level = o.levels[sl];
        var lineColor = null;
        if (level.type === 'resistance' && state.showSupport) lineColor = pal.resistance;
        else if (level.type === 'support' && state.showSupport) lineColor = pal.support;
        else if (level.type === 'fibonacci' && state.showFibonacci) lineColor = pal.fib;
        if (!lineColor) continue;
        if (level.price < minV || level.price > maxV) continue;

        var yLevel = yPos(level.price);
        if (yLevel < padT - 5 || yLevel > padT + chartH + 5) continue;

        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(padL, yLevel);
        ctx.lineTo(W - padR, yLevel);
        ctx.stroke();
        ctx.restore();

        // 标签加半透明底衬，避免与 K 线重叠时不可读
        var labelText = level.label + ' ' + D(level.price, digits);
        ctx.font = 'bold 10px sans-serif';
        var labelW = ctx.measureText(labelText).width;
        ctx.fillStyle = isDark ? 'rgba(30,41,59,0.85)' : 'rgba(255,255,255,0.85)';
        ctx.fillRect(W - padR - labelW - 6, yLevel - 13, labelW + 6, 13);
        ctx.fillStyle = lineColor;
        ctx.textAlign = 'right';
        ctx.fillText(labelText, W - padR - 2, yLevel - 4);
      }
    }

    // 均线（最后一根连到预测点）
    function drawLine(arr, color, futureValue) {
      if (!arr) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      var started = false;
      for (var p = 0; p < arr.length; p++) {
        if (arr[p] == null) continue;
        var px = xPos(p), py = yPos(arr[p]);
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      if (started && futureValue != null) ctx.lineTo(xPos(arr.length), yPos(futureValue));
      ctx.stroke();
    }
    // 长周期均线（可选标注层，避免默认线条过多互相干扰）
    if (state.showLongMA) {
      drawLine(view.ma250, pal.ma250, future ? future.ma250 : null);
      drawLine(view.ma120, pal.ma120, future ? future.ma120 : null);
    }
    // MA60 默认绘制，方便判断中期趋势
    drawLine(view.ma60, pal.ma60, future ? future.ma60 : null);
    drawLine(view.ma20, pal.ma20, future ? future.ma20 : null);
    drawLine(view.ma10, pal.ma10, future ? future.ma10 : null);
    drawLine(view.ma5, pal.ma5, future ? future.ma5 : null);

    // 真实 / 预测 分界线
    if (hasProjection) {
      var futureX = xPos(view.klines.length);
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = isDark ? '#475569' : '#cbd5e1';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(futureX, padT);
      ctx.lineTo(futureX, padT + chartH);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = pal.text;
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('未来', futureX, padT - 3);
    }

    // K 线
    var barW = Math.max(2, Math.min(12, chartW / totalPts * 0.6));
    for (i = 0; i < view.klines.length; i++) {
      var item = view.klines[i];
      var color = item.close >= item.open ? winColor : lossColor;

      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xPos(i), yPos(item.high));
      ctx.lineTo(xPos(i), yPos(item.low));
      ctx.stroke();

      var yOpen = yPos(item.open);
      var yClose = yPos(item.close);
      ctx.fillStyle = color;
      ctx.fillRect(xPos(i) - barW / 2, Math.min(yOpen, yClose), barW, Math.max(Math.abs(yOpen - yClose), 1));
    }

    // 预测 K 线（虚线 + 半透明）
    if (hasProjection) {
      var lastK = view.klines[view.klines.length - 1];
      var prevClose = lastK ? lastK.close : o.projectedPrice;
      var isUp = o.projectedPrice >= prevClose;
      var fBarW = barW * 1.2;
      var fx = xPos(view.klines.length);
      var yPrev = yPos(prevClose);
      var yProjected = yPos(o.projectedPrice);
      var top = Math.min(yPrev, yProjected);
      var bodyH = Math.max(Math.max(yPrev, yProjected) - top, 1);

      ctx.save();
      ctx.setLineDash([3, 2]);
      ctx.strokeStyle = isUp ? winColor : lossColor;
      ctx.fillStyle = isUp ? winColor : lossColor;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(fx, yProjected);
      ctx.lineTo(fx, top + bodyH + 5);
      ctx.stroke();
      ctx.fillRect(fx - fBarW / 2, top, fBarW, bodyH);
      ctx.restore();
    }

    // 日期标签（仅真实数据）
    ctx.fillStyle = pal.text;
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    var step = Math.max(1, Math.floor(view.klines.length / 8));
    for (i = 0; i < view.klines.length; i += step) {
      var dateLabel = view.klines[i].date || '';
      if (dateLabel.length > 5) dateLabel = dateLabel.substr(5);   // 只显示 MM-DD
      ctx.fillText(dateLabel, xPos(i), H - 5);
    }

    // 右侧均线末值标签：k 线画到最右端也不会把 MA 数值挤掉
    // （有预测时展示预测后的均线值，与图上连到预测点的连线一致）
    var rightLabels = [];
    function addRightLabel(key, arr, color, futureValue) {
      var v = futureValue;
      if (v == null && arr) {
        for (var q = arr.length - 1; q >= 0; q--) { if (arr[q] != null) { v = arr[q]; break; } }
      }
      if (v == null) return;
      rightLabels.push({ text: key + ' ' + D(v, digits), color: color, y: yPos(v) });
    }
    addRightLabel('MA5', view.ma5, pal.ma5, future ? future.ma5 : null);
    addRightLabel('MA10', view.ma10, pal.ma10, future ? future.ma10 : null);
    addRightLabel('MA20', view.ma20, pal.ma20, future ? future.ma20 : null);
    addRightLabel('MA60', view.ma60, pal.ma60, future ? future.ma60 : null);
    if (state.showLongMA) {
      addRightLabel('MA120', view.ma120, pal.ma120, future ? future.ma120 : null);
      addRightLabel('MA250', view.ma250, pal.ma250, future ? future.ma250 : null);
    }

    // 自上而下推挤 + 自下而上回压，避免标签互相重叠或越出画布
    rightLabels.sort(function (a, b) { return a.y - b.y; });
    var labelGap = 12;
    for (var r1 = 1; r1 < rightLabels.length; r1++) {
      if (rightLabels[r1].y - rightLabels[r1 - 1].y < labelGap) {
        rightLabels[r1].y = rightLabels[r1 - 1].y + labelGap;
      }
    }
    var labelBottom = padT + chartH;
    for (var r2 = rightLabels.length - 1; r2 >= 0; r2--) {
      if (r2 === rightLabels.length - 1 && rightLabels[r2].y > labelBottom) rightLabels[r2].y = labelBottom;
      if (r2 > 0 && rightLabels[r2].y - rightLabels[r2 - 1].y < labelGap) {
        rightLabels[r2 - 1].y = rightLabels[r2].y - labelGap;
      }
    }
    if (rightLabels.length && rightLabels[0].y < padT + 6) rightLabels[0].y = padT + 6;

    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'left';
    var rightLabelX = W - padR + 6;
    for (var r3 = 0; r3 < rightLabels.length; r3++) {
      var lbl = rightLabels[r3];
      var lblW = ctx.measureText(lbl.text).width;
      ctx.fillStyle = isDark ? 'rgba(30,41,59,0.85)' : 'rgba(255,255,255,0.85)';   // 底衬保证与网格线重叠时仍可读
      ctx.fillRect(rightLabelX - 2, lbl.y - 7, lblW + 4, 13);
      ctx.fillStyle = lbl.color;
      ctx.fillText(lbl.text, rightLabelX, lbl.y + 3);
    }

    // 保存本次绘制的几何信息，供鼠标/触摸命中最近 K 线
    chart.metrics = {
      cssW: W, padL: padL, padT: padT, chartW: chartW, chartH: chartH,
      totalPts: totalPts, len: view.klines.length, digits: digits,
      xOf: xPos, yOf: yPos
    };
    drawCrosshair(ctx, isDark, pal);
  }

  // 窗口尺寸变化时防抖重绘，避免画布尺寸与容器不一致
  window.addEventListener('resize', function () {
    if (!chart.opts) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(scheduleChartPaint, 150);
  });

  /* =========================================================
   * 7. 推演表格
   * ========================================================= */
  function renderChangeColumn(rows, caption, digits) {
    var html = '<div class="table-scroll"><table class="data-table data-table-half">';
    html += '<caption class="sr-only">' + C.escapeHtml(caption) + '</caption>';
    html += '<thead><tr>'
      + '<th scope="col">涨跌幅</th><th scope="col">预测收盘价</th><th scope="col">关键位</th>'
      + '<th scope="col">MA5</th><th scope="col">MA10</th><th scope="col">MA20</th>'
      + '</tr></thead><tbody>';

    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var cls = row.pct === 0 ? 'price-base' : (row.pct > 0 ? 'price-win' : 'price-loss');
      var rowCls = row.pct === state.selectedPct ? ' selected-row' : '';
      var keyText = row.keyLevel ? C.escapeHtml(row.keyLevel.label) + ' ' + D(row.keyLevel.price, digits) : '-';

      html += '<tr class="change-row' + rowCls + '" data-pct="' + row.pct + '" tabindex="0"'
        + ' title="按回车在图表中预览该涨跌幅对应的预测价与均线">';
      html += '<td class="' + cls + '"><strong>' + C.formatPct(row.pct) + '</strong></td>';
      html += '<td class="' + cls + '">' + D(row.price, digits) + '</td>';
      html += '<td class="' + (row.keyHighlight ? 'key-highlight' : '') + '">' + keyText + '</td>';
      html += '<td>' + D(row.ma5, digits) + '</td>';
      html += '<td>' + D(row.ma10, digits) + '</td>';
      html += '<td>' + D(row.ma20, digits) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  function renderChangeTable(title, rows, digits, range) {
    var positive = rows.filter(function (r) { return r.pct >= 0; });
    var negative = rows.filter(function (r) { return r.pct < 0; });

    var html = '<div class="table-card">';
    html += '<div class="table-card-title">' + C.escapeHtml(title) + '</div>';
    html += '<div class="dual-tables">';
    html += '<div class="dual-col">' + renderChangeColumn(positive, '涨幅推演（0% 至 +' + range.up + '%）', digits) + '</div>';
    html += '<div class="dual-col">' + renderChangeColumn(negative, '跌幅推演（-' + range.down + '% 至 0%）', digits) + '</div>';
    html += '</div></div>';
    return html;
  }

  /**
   * 渲染推演表格。档位步长（1% / 5%）可切换，故独立成函数供重复调用。
   * 港股等无涨跌停标的区间较宽（±30%），5% 步长可显著压缩表格长度。
   */
  function renderProjectionTable() {
    var range = state.range;
    var digits = state.digits;
    var changes = C.buildChangeList(-range.down, range.up, state.changeStep);
    var rows = C.buildProjectionRows(state.prices, state.basePrice, changes, state.levels);

    state.rows = rows;
    state.selectedPct = null;                             // 重建后清空选中态，避免残留高亮

    var baseNote = state.marketStatus === 'intraday'
      ? '盘中推演（以昨收 ' + D(state.basePrice, digits) + ' 为基准'
      : '明日推演（以今收 ' + D(state.basePrice, digits) + ' 为基准';
    var title = state.name + '(' + state.code + ') - ' + baseNote + '，每 ' + state.changeStep + '% 一档）';

    tablesWrapper.innerHTML = renderChangeTable(title, rows, digits, range);
    bindRowEvents();
  }

  // 切换档位步长：重建表格并清除图表上的旧档位投影
  function applyChangeStep(step) {
    if (state.changeStep === step) return;
    state.changeStep = step;
    renderProjectionTable();
    setProjectedPrice(null);
    lastResultText = generateCopyText();
  }

  function bindRowEvents() {
    var rows = tablesWrapper.querySelectorAll('.change-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].addEventListener('click', activateRow);
      rows[i].addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateRow.call(this, e); }
      });
    }
  }

  function activateRow() {
    selectPct(parseInt(this.dataset.pct, 10));
  }

  // 选中某档涨跌幅：只更新高亮与图表投影，使用与表格完全一致的基准价
  function selectPct(pct) {
    state.selectedPct = pct;
    var rows = tablesWrapper.querySelectorAll('.change-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('selected-row', parseInt(rows[i].dataset.pct, 10) === pct);
    }
    setProjectedPrice(state.basePrice * (1 + pct / 100));
  }

  /* =========================================================
   * 8. 状态栏 / 复制文本
   * ========================================================= */
  function renderStatusBar() {
    var tagCls = state.marketStatus === 'intraday' ? 'tag-intraday' : 'tag-closed';
    var tagTxt = state.marketStatus === 'intraday' ? '盘中' : '已收盘';

    var html = '<span class="stock-name-display">' + C.escapeHtml(state.name)
      + ' (' + C.escapeHtml(state.code) + ')</span>';
    html += '<span class="price-display">最新价: <strong class="price-win">'
      + D(state.lastPrice, state.digits) + '</strong></span>';

    // 涨跌停价：股民每天要用的数字；港股无涨跌停、退市股无限制时接口返回无效值，此处自动不显示
    if (state.limitUp > 0 || state.limitDown > 0) {
      html += '<span class="price-display limit-display">涨停: <span class="price-win">'
        + D(state.limitUp, state.digits) + '</span> 跌停: <span class="price-loss">'
        + D(state.limitDown, state.digits) + '</span></span>';
    }

    html += '<span class="status-tag ' + tagCls + '">' + tagTxt + '</span>';
    html += '<span class="price-display data-source">数据源: ' + C.escapeHtml(state.sourceName) + '</span>';

    statusBar.innerHTML = html;
    statusBar.classList.remove('hidden');
  }

  /* ===== 信号摘要卡：把均线形态与关键位压缩成可快速阅读的一行 ===== */
  function renderSignalCard() {
    var s = state.signal;
    if (!s) { signalCard.classList.add('hidden'); return; }

    var digits = state.digits;
    var items = [];
    var arrCls = s.arrangement === 'bull' ? 'sig-bull' : (s.arrangement === 'bear' ? 'sig-bear' : 'sig-neutral');
    items.push('<span class="sig-item ' + arrCls + '">' + C.escapeHtml(s.arrangementText) + '</span>');

    if (s.vsMa20) {
      items.push('<span class="sig-item">价格<span class="' + (s.vsMa20 === 'above' ? 'price-win' : 'price-loss') + '">'
        + (s.vsMa20 === 'above' ? '高于' : '低于') + '</span>MA20</span>');
    }
    if (s.vsMa60) {
      items.push('<span class="sig-item">价格<span class="' + (s.vsMa60 === 'above' ? 'price-win' : 'price-loss') + '">'
        + (s.vsMa60 === 'above' ? '高于' : '低于') + '</span>MA60</span>');
    }
    if (s.cross) {
      var when = s.cross.daysAgo === 0 ? '当日' : s.cross.daysAgo + ' 个交易日前';
      items.push('<span class="sig-item">' + when
        + '<strong class="' + (s.cross.type === 'golden' ? 'price-win' : 'price-loss') + '">'
        + (s.cross.type === 'golden' ? '金叉' : '死叉') + '</strong>（MA5/MA10）</span>');
    }
    if (s.resistance) {
      items.push('<span class="sig-item">上方压力 ' + C.escapeHtml(s.resistance.label) + ' '
        + D(s.resistance.price, digits) + '<span class="sig-pct">+' + (s.resistance.pctDiff * 100).toFixed(2) + '%</span></span>');
    }
    if (s.support) {
      items.push('<span class="sig-item">下方支撑 ' + C.escapeHtml(s.support.label) + ' '
        + D(s.support.price, digits) + '<span class="sig-pct">-' + (s.support.pctDiff * 100).toFixed(2) + '%</span></span>');
    }
    items.push('<span class="sig-item sig-tip">均为历史统计结果，不构成投资建议</span>');

    signalCard.innerHTML = items.join('');
    signalCard.classList.remove('hidden');
  }

  // 表头/行数据统一来源，保证文本、CSV、Markdown 三种导出内容一致
  var EXPORT_HEADERS = ['涨跌幅', '预测收盘价', '关键位', 'MA5', 'MA10', 'MA20'];

  function exportCellValues() {
    var digits = state.digits;
    return state.rows.map(function (row) {
      return [
        C.formatPct(row.pct),
        D(row.price, digits),
        row.keyLevel ? row.keyLevel.label + ' ' + D(row.keyLevel.price, digits) : '-',
        D(row.ma5, digits),
        D(row.ma10, digits),
        D(row.ma20, digits)
      ];
    });
  }

  // 各周期当前均线值（用于头部摘要）
  function maSummaryText(sep) {
    var digits = state.digits;
    var parts = [];
    state.maPeriods.forEach(function (period) {
      var value = state.baseMAs['ma' + period];
      if (value == null) return;
      parts.push('MA' + period + ' ' + D(value, digits));
    });
    return parts.join(sep);
  }

  function exportHeaderLines() {
    var digits = state.digits;
    var lines = [];
    lines.push('最新价 ' + D(state.lastPrice, digits)
      + ' | 状态 ' + (state.marketStatus === 'intraday' ? '盘中' : '已收盘'));
    if (state.limitUp > 0 || state.limitDown > 0) {
      lines.push('涨停 ' + D(state.limitUp, digits) + ' | 跌停 ' + D(state.limitDown, digits));
    }
    lines.push(maSummaryText('  '));
    var rangeNote = state.range && state.range.source === 'limit'
      ? '推演区间 ±涨跌停（+' + state.range.up + '% / -' + state.range.down + '%）'
      : '推演区间 ±' + state.fallbackLimit + '%（该标的接口未提供涨跌停价）';
    lines.push(rangeNote + ' | 档位步长 ' + state.changeStep + '%');
    return lines;
  }

  function generateCopyText() {
    var text = state.name + '(' + state.code + ') 均线测算\n';
    text += exportHeaderLines().join('\n') + '\n';
    text += '数据源: ' + state.sourceName + '\n';
    text += '========================================\n\n';
    text += EXPORT_HEADERS.join('\t') + '\n';
    text += '----------------------------------------\n';
    exportCellValues().forEach(function (cells) {
      text += cells.join('\t') + '\n';
    });
    text += '\n注：以上为基于历史数据的统计推演，不构成投资建议。\n';
    return text;
  }

  function generateCsv() {
    function esc(value) {
      var s = String(value);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = [];
    lines.push(esc(state.name + '(' + state.code + ') 均线测算'));
    exportHeaderLines().forEach(function (line) { lines.push(esc(line)); });
    lines.push(esc('数据源: ' + state.sourceName));
    lines.push('');
    lines.push(EXPORT_HEADERS.map(esc).join(','));
    exportCellValues().forEach(function (cells) {
      lines.push(cells.map(esc).join(','));
    });
    return lines.join('\r\n');
  }

  function generateMarkdown() {
    var lines = [];
    lines.push('### ' + state.name + '(' + state.code + ') 均线测算');
    lines.push('');
    exportHeaderLines().forEach(function (line) { lines.push('- ' + line); });
    lines.push('- 数据源: ' + state.sourceName);
    lines.push('');
    lines.push('| ' + EXPORT_HEADERS.join(' | ') + ' |');
    lines.push('| ' + EXPORT_HEADERS.map(function () { return '---'; }).join(' | ') + ' |');
    exportCellValues().forEach(function (cells) {
      lines.push('| ' + cells.join(' | ') + ' |');
    });
    lines.push('');
    lines.push('> 以上为基于历史数据的统计推演，不构成投资建议。');
    return lines.join('\n');
  }

  // 触发浏览器下载（导出图片用）
  function downloadDataUrl(url, filename) {
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* =========================================================
   * 9. 主流程
   * ========================================================= */
  function renderResult(code, market, data) {
    var prices = data.prices;
    var klines = data.klines || [];
    var name = data.name || ('股票' + code);

    saveHistory(code, name);

    var lastPrice = prices[prices.length - 1];
    var historyPrices = prices.slice(-CONFIG.KLINE_DAYS);
    var digits = C.getPriceDigits(code, lastPrice);
    var start = Math.max(0, klines.length - historyPrices.length);
    var alignedKlines = klines.slice(start, start + historyPrices.length);

    // 涨跌停价仅在 A 股有效，为非正数（港股无关字段 / 退市股 -1）时视为无涨跌停
    var limitUp = (data.limitUp > 0) ? data.limitUp : null;
    var limitDown = (data.limitDown > 0) ? data.limitDown : null;
    var prevClose = data.prevClose > 0 ? data.prevClose : lastPrice;

    // 市场状态以行情时间为准，避免节假日/非交易日把上一交易日的行情当成盘中
    var marketStatus = C.resolveMarketStatus(market, data.quoteTime);

    // 盘中以昨日收盘为基准推演次日，已收盘以今日收盘为基准
    var basePrice = marketStatus === 'intraday'
      ? (prevClose || (prices.length >= 2 ? prices[prices.length - 2] : lastPrice))
      : lastPrice;

    // 推演区间随板块涨跌停自适应（主板 ±10%、创业板/科创板 ±20%）；
    // 无涨跌停价的标的按市场取兜底值：港股 ±30%（无涨跌停限制），其余 ±10%
    var fallbackLimit = market === 'hk' ? CONFIG.CHANGE_LIMIT_HK : CONFIG.CHANGE_LIMIT;
    var range = C.deriveChangeRange(prevClose, limitUp, limitDown, fallbackLimit);

    var levels = C.computeSupportResistance(alignedKlines, historyPrices);
    var maArrs = C.buildMAArrays(historyPrices, CONFIG.MA_PERIODS);

    var baseMAs = {};
    CONFIG.MA_PERIODS.forEach(function (period) {
      baseMAs['ma' + period] = C.calcMA(historyPrices, period);
    });

    state.code = code;
    state.market = market;
    state.name = name;
    state.marketStatus = marketStatus;
    state.sourceName = data.source || '未知';
    state.prices = historyPrices;
    state.klines = alignedKlines;
    state.lastPrice = lastPrice;
    state.prevClose = prevClose;
    state.limitUp = limitUp;
    state.limitDown = limitDown;
    state.quoteTime = data.quoteTime || '';
    state.basePrice = basePrice;
    state.digits = digits;
    state.levels = levels;
    state.ma = maArrs;
    state.maPeriods = CONFIG.MA_PERIODS;
    state.baseMAs = baseMAs;
    state.signal = C.buildSignalSummary(maArrs, lastPrice, levels);
    state.range = range;
    state.fallbackLimit = fallbackLimit;
    state.selectedPct = null;                             // 重置选中态，避免沿用上一只股票的高亮

    renderStatusBar();
    renderSignalCard();
    srToggleBar.classList.remove('hidden');
    tableToolbar.classList.remove('hidden');
    renderProjectionTable();

    resultTitle.textContent = name + '(' + code + ') 均线测算';
    resultSection.classList.add('show');

    drawKLineChart({
      klines: alignedKlines,
      prices: historyPrices,
      ma5Arr: maArrs.ma5,
      ma10Arr: maArrs.ma10,
      ma20Arr: maArrs.ma20,
      ma60Arr: maArrs.ma60,
      ma120Arr: maArrs.ma120,
      ma250Arr: maArrs.ma250,
      name: name,
      code: code,
      digits: digits,
      levels: levels,
      projectedPrice: null
    });

    lastResultText = generateCopyText();
  }

  function doQuery() {
    var code = C.validateCode(stockInput.value);
    if (!code) {
      showError('请输入有效的股票代码：A股 6 位数字，港股 5 位数字');
      stockInput.focus();
      return;
    }
    var market = C.getMarket(code);
    if (!market) {
      showError('暂不支持该代码段：沪市 6/9/5 开头，深市 0/1/3/4/8 开头，港股 5 位数字');
      stockInput.focus();
      return;
    }

    hideError();
    hideAutocomplete();

    var seq = ++querySeq;
    showLoading(true);
    emptyState.classList.add('hidden');
    statusBar.classList.add('hidden');
    resultSection.classList.remove('show');
    lastResultText = '';

    fetchAllData(code, market)
      .then(function (data) {
        if (seq !== querySeq) return;                     // 已有更新的查询，丢弃过期响应
        renderResult(code, market, data);
      })
      .catch(function (err) {
        if (seq !== querySeq || (err && err.cancelled)) return;
        showError((err && err.message) || '查询失败，请检查股票代码后重试');
        emptyState.classList.remove('hidden');
      })
      .finally(function () {
        if (seq === querySeq) showLoading(false);         // 仅当前查询负责关闭遮罩
      });
  }

  /* =========================================================
   * 10. 事件绑定
   * ========================================================= */
  queryBtn.addEventListener('click', doQuery);
  // 暴露给外部自动化测试使用
  window._doQueryInline = doQuery;

  clearBtn.addEventListener('click', function () {
    if (currentAbort) {
      currentAbort.cancelled = true;
      currentAbort.controller.abort();
    }
    stockInput.value = '';
    resultSection.classList.remove('show');
    srToggleBar.classList.add('hidden');
    tableToolbar.classList.add('hidden');
    statusBar.classList.add('hidden');
    signalCard.classList.add('hidden');           // 一起隐藏信号卡，避免残留上一只股票结论
    emptyState.classList.remove('hidden');
    hideError();
    hideAutocomplete();
    lastResultText = '';
    state.selectedPct = null;
    chart.opts = null;
    chart.metrics = null;
    chart.hoverIndex = null;
    stockInput.focus();
  });

  // 通用复制：优先 Clipboard API，失败回退 execCommand
  function copyText(text, btn) {
    if (!text) { showError('暂无可复制的内容，请先查询'); return; }
    var defaultLabel = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', defaultLabel);

    function done(ok) {
      btn.textContent = ok ? '已复制!' : '复制失败，请手动选择内容复制';
      btn.classList.toggle('is-done', ok);
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        btn.textContent = defaultLabel;
        btn.classList.remove('is-done');
      }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { done(true); })
        .catch(function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }

  // 兜底复制（旧浏览器 / 非安全上下文）
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener('click', function () {
    copyText(lastResultText, copyBtn);
  });

  copyCsvBtn.addEventListener('click', function () {
    if (!state.rows || !state.rows.length) { showError('暂无数据，请先查询'); return; }
    copyText(generateCsv(), copyCsvBtn);
  });

  copyMdBtn.addEventListener('click', function () {
    if (!state.rows || !state.rows.length) { showError('暂无数据，请先查询'); return; }
    copyText(generateMarkdown(), copyMdBtn);
  });

  exportPngBtn.addEventListener('click', function () {
    var canvas = chart.refs && chart.refs.canvas;
    if (!canvas || !chart.opts) { showError('暂无可导出的图表，请先查询'); return; }
    var url = '';
    try {
      url = canvas.toDataURL('image/png');                 // 画布可能被浏览器标记为不可导出，需容错
    } catch (e) {
      url = '';
    }
    if (!url || url.indexOf('data:image/png') !== 0) {
      showError('图片导出失败，请改用「复制文本」或截图保存');
      return;
    }
    var label = exportPngBtn.getAttribute('data-label') || exportPngBtn.textContent;
    exportPngBtn.setAttribute('data-label', label);
    var filename = (state.name || 'stock') + '_' + (state.code || '') + '_均线测算.png';
    downloadDataUrl(url, filename);
    exportPngBtn.textContent = '已导出!';
    exportPngBtn.classList.add('is-done');
    if (copyTimer) clearTimeout(copyTimer);
    copyTimer = setTimeout(function () {
      exportPngBtn.textContent = label;
      exportPngBtn.classList.remove('is-done');
    }, 1800);
  });

  /* ===== 标注层开关 ===== */
  toggleSupResEl.addEventListener('change', function () {
    state.showSupport = this.checked;
    scheduleChartPaint();
  });
  toggleFibEl.addEventListener('change', function () {
    state.showFibonacci = this.checked;
    scheduleChartPaint();
  });
  // 长周期均线默认关闭：MA5/10/20/60 已足够判断趋势，按需开启
  if (toggleLongMAEl) {
    toggleLongMAEl.addEventListener('change', function () {
      state.showLongMA = this.checked;
      scheduleChartPaint();
    });
  }

  /* ===== 推演档位步长（1% / 5%） ===== */
  step1El.addEventListener('change', function () { applyChangeStep(1); });
  step5El.addEventListener('change', function () { applyChangeStep(5); });

})();

</script>
